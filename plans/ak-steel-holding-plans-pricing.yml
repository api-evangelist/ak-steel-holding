description: AK Steel Holding ceased to exist as an independent company in March 2020 when it was
  acquired by Cleveland-Cliffs Inc. There is no AK Steel API product, developer portal, or published
  pricing. The only "AK Steel" digital surface that persists is its archived SEC investor-relations
  page; current steel-products commerce flows through Cleveland-Cliffs sales and contract pricing on
  steel tonnage, not API consumption.
notes: AK Steel Holding is a defunct entity (now Cleveland-Cliffs). No API rate card has ever been
  published. Plan below is a placeholder reflecting the historical sales-quote model.
sources:
  - https://www.clevelandcliffs.com/
  - https://en.wikipedia.org/wiki/AK_Steel
