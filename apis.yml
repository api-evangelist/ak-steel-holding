description: >-
  AK Steel Holding Corporation was a leading producer of flat-rolled carbon,
  stainless, and electrical steel products, as well as carbon and stainless
  tubular products, primarily serving the automotive, infrastructure,
  manufacturing, and electrical power markets. AK Steel was acquired by
  Cleveland-Cliffs Inc. in March 2020 and now operates as a subsidiary.
