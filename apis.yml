  - type: Features
    data:
      - name: Flat-Rolled Carbon Steel
        description: >-
          High-quality flat-rolled carbon steel products serving automotive and
          manufacturing sectors, including advanced high-strength steel grades
          for lightweighting applications.
      - name: Stainless Steel Products
        description: >-
          Stainless and electrical steel products for infrastructure,
          manufacturing, and electrical power generation applications.
      - name: Tubular Products
        description: >-
          Carbon and stainless tubular products and related customer solutions
          through subsidiary operations.
      - name: Automotive Steel Solutions
        description: >-
          Specialized automotive steel production including hot- and
          cold-stamped components, die design, and tooling services.
  - type: UseCases
    data:
      - name: Automotive Manufacturing
        description: >-
          Steel suppliers and automotive OEMs source advanced high-strength
          steel for vehicle body structures and components.
      - name: Electrical Power Infrastructure
        description: >-
          Utilities and electrical equipment manufacturers source specialized
          electrical steel for transformers and motors.
      - name: Construction and Infrastructure
        description: >-
          Infrastructure projects source flat-rolled carbon steel for
          structural applications.
